<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legajos — Nave Asterión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@600;800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#040910;
    --cyan:#2de6c0;
    --cyan-soft:#7fe6cf;
    --amber:#e6b86a;
    --text:#e4f7f1;
    --text-dim:#8fb5ac;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 15% 0%, rgba(45,230,192,0.12), transparent 50%),
      radial-gradient(ellipse at 85% 100%, rgba(45,230,192,0.08), transparent 50%),
      var(--bg);
    background-repeat:no-repeat;
    background-attachment:fixed;
    background-size:100% 100%;
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    padding:0 24px 100px;
  }

  .topbar{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 0 8px;
  }
  .console-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--text-dim);
    text-decoration:none;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    border:1px solid rgba(127,230,207,0.22);
    padding:8px 14px;
    border-radius:2px;
    background:rgba(12,28,34,0.35);
    backdrop-filter:blur(8px);
    transition:border-color .2s, color .2s, background .2s;
  }
  .console-link:hover{color:var(--cyan); border-color:var(--cyan); background:rgba(12,28,34,0.55);}
  .console-link .arrow{font-size:14px;}
  .topbar-spacer{width:150px;}

  header{
    max-width:1100px;
    margin:0 auto 40px;
    text-align:center;
  }
  header h1{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    letter-spacing:3px;
    font-size:24px;
    color:var(--cyan);
    text-shadow:0 0 20px rgba(45,230,192,0.4);
    margin:0 0 4px;
  }
  header .sub{
    color:var(--text-dim);
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
  }

  .stage{
    max-width:1100px;
    margin:0 auto;
  }

  .sections{}
  .section{margin-bottom:36px;}
  .section-title{
    font-family:'Orbitron', sans-serif;
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--cyan-soft);
    margin:0 0 16px;
    padding-bottom:8px;
    border-bottom:1px solid rgba(127,230,207,0.18);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:20px;
  }
  .card{
    position:relative;
    aspect-ratio:3/4.6;
    cursor:pointer;
    border-radius:4px;
    overflow:hidden;
    background:linear-gradient(155deg, rgba(45,230,192,0.10), rgba(255,255,255,0.02) 40%, rgba(45,230,192,0.03)), #0a1620;
    background-size:cover;
    background-repeat:no-repeat;
    background-position:center;
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), inset 0 0 40px rgba(45,230,192,0.03);
    transition:box-shadow .25s, transform .25s;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.1), 0 0 0 1px rgba(45,230,192,0.55), 0 8px 30px rgba(45,230,192,0.12);
  }
  .card::before{
    content:'';
    position:absolute;
    top:0; left:-60%;
    width:40%; height:140%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,0.06), transparent);
    transform:rotate(8deg);
    pointer-events:none;
  }
  .no-portrait{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:rgba(143,181,172,0.4);
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .scrim{
    position:absolute;
    left:0; right:0; bottom:0;
    height:58%;
    background:linear-gradient(to top, rgba(2,8,10,0.88) 0%, rgba(2,8,10,0.55) 40%, transparent 100%);
  }
  .tag-corner{
    position:absolute;
    top:10px; right:10px;
    font-size:8.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--cyan-soft);
    background:rgba(4,9,16,0.55);
    border:1px solid rgba(127,230,207,0.3);
    padding:3px 7px;
    border-radius:2px;
    backdrop-filter:blur(6px);
  }
  .card-info{
    position:absolute;
    left:14px; right:14px; bottom:12px;
  }
  .card-info h3{
    font-family:'Orbitron', sans-serif;
    font-size:12.5px;
    color:#fff;
    margin:0 0 3px;
    letter-spacing:.3px;
    text-shadow:0 1px 4px rgba(0,0,0,0.6);
  }
  .card-info .rango{
    font-size:9.5px;
    color:var(--cyan-soft);
    letter-spacing:.5px;
  }

  .detail{display:none;}
  .detail.active{display:block;}

  .detail-toolbar{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-bottom:24px;
  }
  .toolbar-row-top{
    display:flex;
  }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(12,28,34,0.4);
    backdrop-filter:blur(10px);
    border:1px solid rgba(127,230,207,0.25);
    color:var(--text-dim);
    font-family:inherit;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:8px 15px;
    cursor:pointer;
    border-radius:2px;
    transition:color .2s, border-color .2s;
  }
  .back-btn:hover{color:var(--cyan); border-color:var(--cyan);}
  .chapter-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chapter-tab{
    background:rgba(12,28,34,0.4);
    backdrop-filter:blur(10px);
    border:1px solid rgba(127,230,207,0.2);
    color:var(--text-dim);
    font-family:inherit;
    font-size:10.5px;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding:7px 13px;
    cursor:pointer;
    border-radius:2px;
    transition:border-color .2s, color .2s, background .2s;
  }
  .chapter-tab:hover{color:var(--cyan-soft); border-color:rgba(127,230,207,0.4);}
  .chapter-tab.active{
    color:var(--bg);
    background:var(--cyan);
    border-color:var(--cyan);
  }

  .detail-content{
    overflow:hidden;
    position:relative;
    background:rgba(6,14,18,0.62);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(127,230,207,0.14);
    border-radius:6px;
    padding:28px 32px;
    opacity:0;
    transform:translateY(10px);
  }
  .sections{
    opacity:1;
    transition:opacity .3s ease;
  }
  .detail-portrait{
    float:left;
    width:250px;
    aspect-ratio:3/4.6;
    margin:0 28px 18px 0;
    border-radius:4px;
    overflow:hidden;
    position:relative;
    background:linear-gradient(155deg, rgba(45,230,192,0.12), rgba(255,255,255,0.02) 40%, rgba(45,230,192,0.04)), #0a1620;
    background-size:cover;
    background-repeat:no-repeat;
    background-position:center;
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.1), 0 0 0 1px rgba(127,230,207,0.3), 0 10px 40px rgba(45,230,192,0.1);
    will-change:transform;
  }
  .detail-portrait .no-portrait{font-size:10px;}
  .detail-portrait .card-info h3{font-size:15px;}
  .detail-portrait .card-info .rango{font-size:10.5px;}

  .historia{
    font-family:'Cormorant Garamond', serif;
  }
  .historia h3{
    font-family:'Orbitron', sans-serif;
    font-size:14px;
    color:var(--cyan);
    letter-spacing:.5px;
    margin:24px 0 10px;
  }
  .historia h3:first-child{margin-top:0;}
  .historia h4{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--cyan-soft);
    letter-spacing:.5px;
    text-transform:uppercase;
    margin:20px 0 8px;
  }
  .historia p{
    font-size:19px;
    line-height:1.75;
    color:var(--text);
    margin:0 0 1.05em;
    text-align:justify;
    text-justify:inter-word;
    hyphens:auto;
    -webkit-hyphens:auto;
    overflow-wrap:break-word;
  }
  .historia p:first-of-type::first-letter{
    font-family:'Orbitron', sans-serif;
    font-size:2.6em;
    float:left;
    line-height:0.85;
    padding:0.05em 0.08em 0 0;
    color:var(--cyan);
    text-shadow:0 0 16px rgba(45,230,192,0.35);
  }
  .historia strong{color:var(--cyan-soft); font-weight:600;}
  .historia .quote{color:var(--amber);}
  .historia p.dialogue{
    font-style:italic;
    color:var(--cyan-soft);
    border-left:2px solid rgba(45,230,192,0.35);
    padding-left:16px;
    margin-left:2px;
  }
  .historia p:last-child{margin-bottom:0;}

  /* Glitch / classified effect */
  .detail-content.classified{
    position:relative;
    border-color:rgba(255,34,51,0.32);
    box-shadow:inset 0 0 50px rgba(255,34,51,0.05), 0 0 26px rgba(255,34,51,0.06);
  }
  .detail-content.classified::before{
    content:'';
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,34,51,0.035) 0px, transparent 1px, transparent 3px);
    animation:classifiedFlicker 3.2s linear infinite;
  }
  @keyframes classifiedFlicker{
    0%, 92%, 100%{opacity:1;}
    93%{opacity:0.4;}
    94%{opacity:0.9;}
    95%{opacity:0.3;}
    96%{opacity:1;}
  }
  .corrupt-banner{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#ff5566;
    border:1px solid rgba(255,85,102,0.4);
    background:rgba(255,34,51,0.08);
    padding:6px 12px;
    border-radius:2px;
    margin-bottom:18px;
    animation:redactPulse 1.4s ease-in-out infinite;
  }
  .gw{display:inline;}
  .gw-scramble{
    color:#ff5566;
    text-shadow:0 0 6px rgba(255,85,102,0.6);
  }
  .gw-redacted{
    color:#ff2233;
    background:rgba(255,34,51,0.14);
    padding:0 3px;
    border-radius:2px;
    letter-spacing:1px;
    animation:redactPulse 0.6s ease-in-out infinite;
  }
  @keyframes redactPulse{
    0%,100%{ text-shadow:0 0 4px rgba(255,34,51,0.5); opacity:1;}
    50%{ text-shadow:0 0 14px rgba(255,34,51,0.9); opacity:0.7;}
  }
  .redacted-stamp{
    position:absolute;
    z-index:2;
    pointer-events:none;
    user-select:none;
    right:6%;
    bottom:8%;
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:clamp(2.2rem, 6vw, 4.4rem);
    letter-spacing:4px;
    color:transparent;
    -webkit-text-stroke:2px rgba(255,34,51,0.55);
    border:5px solid rgba(255,34,51,0.5);
    padding:6px 22px;
    border-radius:4px;
    transform:rotate(-11deg);
    opacity:0;
    animation:stampIn .5s ease-out .3s forwards, stampPulse 2.6s ease-in-out 1s infinite;
    white-space:nowrap;
  }
  @keyframes stampIn{
    from{opacity:0; transform:rotate(-11deg) scale(1.3);}
    to{opacity:0.55; transform:rotate(-11deg) scale(1);}
  }
  @keyframes stampPulse{
    0%,100%{opacity:0.5;}
    50%{opacity:0.75;}
  }
  @media (max-width:820px){
    .redacted-stamp{right:50%; bottom:4%; transform:translateX(50%) rotate(-9deg); font-size:clamp(1.6rem,10vw,2.6rem);}
    @keyframes stampIn{
      from{opacity:0; transform:translateX(50%) rotate(-9deg) scale(1.3);}
      to{opacity:0.55; transform:translateX(50%) rotate(-9deg) scale(1);}
    }
  }

  .empty, .loading{
    text-align:center;
    color:var(--text-dim);
    padding:60px 0;
    letter-spacing:1px;
  }

  @media (max-width:820px){
    .grid{grid-template-columns:repeat(2, 1fr);}
    .detail-content{padding:20px;}
    .detail-portrait{float:none; width:100%; max-width:300px; margin:0 auto 20px;}
    .historia p{font-size:17px;}
  }
</style>
</head>
<body>
  <div class="topbar">
    <a class="console-link" href="../index.html"><span class="arrow">&larr;</span> Volver a la consola</a>
    <div class="topbar-spacer"></div>
  </div>

  <header>
    <h1>Legajos</h1>
    <div class="sub">Nave Asterión — registro de tripulación</div>
  </header>

  <div class="stage" id="stage">
    <div class="sections" id="sections">
      <div class="loading">Cargando legajos...</div>
    </div>

    <div class="detail" id="detail">
      <div class="detail-toolbar">
        <div class="toolbar-row-top">
          <button class="back-btn" id="backBtn">&larr; Volver a legajos</button>
        </div>
        <div class="chapter-tabs" id="chapterTabs"></div>
      </div>
      <div class="detail-content">
        <div class="detail-portrait" id="detailPortrait">
          <div class="no-portrait" id="dNoPortrait">Sin retrato</div>
          <div class="scrim"></div>
          <span class="tag-corner" id="dTagCorner"></span>
          <div class="card-info"><h3 id="dNombre"></h3><div class="rango" id="dRango"></div></div>
        </div>
        <div class="historia" id="dHistoria"></div>
      </div>
    </div>
  </div>

<script>
let TRIPULANTES = [];
let SECCIONES = [];
let currentCapitulos = [];
let glitchInterval = null;

function stopGlitch(){
  if(glitchInterval){ clearInterval(glitchInterval); glitchInterval = null; }
}

function wrapWordsForGlitch(root){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const textNodes = [];
  let node;
  while(node = walker.nextNode()){ if(node.nodeValue.trim()) textNodes.push(node); }
  textNodes.forEach(tn => {
    const frag = document.createDocumentFragment();
    const parts = tn.nodeValue.split(/(\s+)/);
    parts.forEach(part => {
      if(part.trim() === ''){
        frag.appendChild(document.createTextNode(part));
      } else {
        const span = document.createElement('span');
        span.className = 'gw';
        span.textContent = part;
        span.dataset.orig = part;
        frag.appendChild(span);
      }
    });
    tn.parentNode.replaceChild(frag, tn);
  });
}

const GLITCH_CHARS = '█▓▒░▚▞#%&$@01■◆×÷≠∆¤§';
function randomGlitchString(len){
  let s = '';
  for(let i = 0; i < len; i++) s += GLITCH_CHARS[Math.floor(Math.random() * GLITCH_CHARS.length)];
  return s;
}

function startGlitch(root){
  stopGlitch();
  const spans = root.querySelectorAll('.gw');
  if(!spans.length) return;
  glitchInterval = setInterval(() => {
    const count = 1 + Math.floor(Math.random() * 2);
    for(let i = 0; i < count; i++){
      const span = spans[Math.floor(Math.random() * spans.length)];
      if(!span || span.dataset.busy === '1') continue;
      span.dataset.busy = '1';
      const isRedact = Math.random() < 0.1;
      if(isRedact){
        span.textContent = 'CENSURADO';
        span.classList.add('gw-redacted');
        setTimeout(() => {
          span.textContent = span.dataset.orig;
          span.classList.remove('gw-redacted');
          span.dataset.busy = '0';
        }, 900 + Math.random() * 700);
      } else {
        const orig = span.dataset.orig;
        span.textContent = randomGlitchString(orig.length);
        span.classList.add('gw-scramble');
        setTimeout(() => {
          span.textContent = orig;
          span.classList.remove('gw-scramble');
          span.dataset.busy = '0';
        }, 120 + Math.random() * 180);
      }
    }
  }, 160);
}

function applyEffectIfAny(t){
  const detailContent = document.querySelector('.detail-content');
  const historiaEl = document.getElementById('dHistoria');
  const existingBanner = historiaEl.parentElement.querySelector('.corrupt-banner');
  if(existingBanner) existingBanner.remove();
  const existingStamp = detailContent.querySelector('.redacted-stamp');
  if(existingStamp) existingStamp.remove();
  stopGlitch();
  if(t.efecto === 'clasificado'){
    detailContent.classList.add('classified');
    const banner = document.createElement('div');
    banner.className = 'corrupt-banner';
    banner.textContent = '⚠ Archivo parcialmente corrupto — nivel de acceso insuficiente';
    historiaEl.parentElement.insertBefore(banner, historiaEl);
    wrapWordsForGlitch(historiaEl);
    startGlitch(historiaEl);
    const stamp = document.createElement('div');
    stamp.className = 'redacted-stamp';
    stamp.textContent = 'CENSURADO';
    detailContent.appendChild(stamp);
  } else {
    detailContent.classList.remove('classified');
  }
}

async function cargar(){
  try{
    const res = await fetch('legajos.json');
    const data = await res.json();
    SECCIONES = data.secciones || [];
    TRIPULANTES = SECCIONES.flatMap(s => s.tripulantes || []);
    render();
  }catch(e){
    document.getElementById('sections').innerHTML = '<div class="empty">No se pudieron cargar los legajos.</div>';
  }
}

function cardHtml(t, idx){
  return `
    <div class="card" data-idx="${idx}" style="${t.retrato ? `background-image:url('${t.retrato}')` : ''}">
      ${t.retrato ? '' : '<div class="no-portrait">Sin retrato</div>'}
      <div class="scrim"></div>
      ${t.tag ? `<span class="tag-corner">${t.tag}</span>` : ''}
      <div class="card-info">
        <h3>${t.nombre}</h3>
        <div class="rango">${t.rango}</div>
      </div>
    </div>
  `;
}

function render(){
  const container = document.getElementById('sections');
  if(!TRIPULANTES.length){
    container.innerHTML = '<div class="empty">Sin registros.</div>';
    return;
  }
  let globalIdx = 0;
  container.innerHTML = SECCIONES.map(seccion => {
    const cards = (seccion.tripulantes || []).map(t => cardHtml(t, globalIdx++)).join('');
    return `
      <div class="section">
        <div class="section-title">${seccion.titulo}</div>
        <div class="grid">${cards}</div>
      </div>
    `;
  }).join('');
  container.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => abrirDetalle(TRIPULANTES[+card.dataset.idx], card));
  });
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderChapterText(texto){
  const blocks = texto.split(/\n{2,}/).map(b => b.trim()).filter(Boolean);
  return blocks.map(block => {
    if(block.startsWith('### ')){
      const cleaned = block.slice(4).replace(/^Parte\s+[IVXLC]+:\s*/i, '');
      return `<h4>${escapeHtml(cleaned)}</h4>`;
    }
    if(block.startsWith('## ')){
      return `<h3>${escapeHtml(block.slice(3))}</h3>`;
    }
    const isDialogue = block.startsWith('—') || block.startsWith('-');
    let html = escapeHtml(block)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/"([^"]+)"/g, '<span class="quote">&ldquo;$1&rdquo;</span>')
      .replace(/\n/g, '<br>');
    return `<p${isDialogue ? ' class="dialogue"' : ''}>${html}</p>`;
  }).join('');
}

function abrirDetalle(t, cardEl){
  const detail = document.getElementById('detail');
  const detailPortrait = document.getElementById('detailPortrait');
  const detailContent = document.querySelector('.detail-content');
  const sections = document.getElementById('sections');

  const cardRect = cardEl.getBoundingClientRect();

  detailPortrait.style.backgroundImage = t.retrato ? `url('${t.retrato}')` : '';
  document.getElementById('dNoPortrait').style.display = t.retrato ? 'none' : 'flex';
  document.getElementById('dTagCorner').textContent = t.tag || '';
  document.getElementById('dTagCorner').style.display = t.tag ? 'block' : 'none';
  document.getElementById('dNombre').textContent = t.nombre;
  document.getElementById('dRango').textContent = t.rango;

  currentCapitulos = (t.capitulos && t.capitulos.length) ? t.capitulos : [{titulo:'Historia', texto: t.historia || 'Sin información registrada.'}];
  const tabsEl = document.getElementById('chapterTabs');
  tabsEl.innerHTML = currentCapitulos.map((c, i) => `<button class="chapter-tab${i===0?' active':''}" data-ci="${i}">${c.titulo}</button>`).join('');
  tabsEl.querySelectorAll('.chapter-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      tabsEl.querySelectorAll('.chapter-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('dHistoria').innerHTML = renderChapterText(currentCapitulos[+btn.dataset.ci].texto);
      applyEffectIfAny(t);
      window.scrollTo({top: 0, behavior:'smooth'});
    });
  });
  document.getElementById('dHistoria').innerHTML = renderChapterText(currentCapitulos[0].texto);
  applyEffectIfAny(t);

  sections.style.display = 'none';
  detail.classList.add('active');
  window.scrollTo(0, 0);

  detailContent.style.transition = 'none';
  detailContent.style.opacity = '0';
  detailContent.style.transform = 'translateY(10px)';

  const isMobile = window.innerWidth <= 820;
  if(!isMobile){
    const targetRect = detailPortrait.getBoundingClientRect();
    const dx = cardRect.left - targetRect.left;
    const dy = cardRect.top - targetRect.top;
    const scaleX = cardRect.width / targetRect.width;
    const scaleY = cardRect.height / targetRect.height;
    detailPortrait.style.transition = 'none';
    detailPortrait.style.transformOrigin = 'top left';
    detailPortrait.style.transform = `translate(${dx}px, ${dy}px) scale(${scaleX}, ${scaleY})`;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        detailPortrait.style.transition = 'transform .55s cubic-bezier(.2,.8,.2,1)';
        detailPortrait.style.transform = 'translate(0px, 0px) scale(1, 1)';
        detailContent.style.transition = 'opacity .5s ease .2s, transform .5s ease .2s';
        detailContent.style.opacity = '1';
        detailContent.style.transform = 'translateY(0)';
      });
    });
  } else {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        detailContent.style.transition = 'opacity .4s ease';
        detailContent.style.opacity = '1';
        detailContent.style.transform = 'translateY(0)';
      });
    });
  }
}

document.getElementById('backBtn').addEventListener('click', () => {
  stopGlitch();
  const detail = document.getElementById('detail');
  const sections = document.getElementById('sections');
  const detailContent = document.querySelector('.detail-content');

  detailContent.style.transition = 'opacity .28s ease, transform .28s ease';
  detailContent.style.opacity = '0';
  detailContent.style.transform = 'translateY(-8px)';

  setTimeout(() => {
    detail.classList.remove('active');
    sections.style.display = '';
    sections.style.opacity = '0';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        sections.style.transition = 'opacity .4s ease';
        sections.style.opacity = '1';
      });
    });
  }, 260);
});

cargar();
</script>
